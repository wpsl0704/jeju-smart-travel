name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Selenium
        run: pip install selenium
      - name: Wake app
        run: python wake_app.py
